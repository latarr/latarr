<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>LATARR TV PRO</title>
<style>
:root {
  --bg-obsidian: #0d0f14;
  --bg-header: #0b0e14;
  --card-bg: #111820;
  --card-focus: #182535;
  --cyan: #00e5ff;
  --cyan-glow: rgba(0, 229, 255, 0.45);
  --text-main: #ffffff;
  --text-muted: #8e95a5;
  --text-item: #b0b8c8;
  --border-light: rgba(255, 255, 255, 0.08);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  background-color: var(--bg-obsidian);
  color: var(--text-main);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow: hidden;
  width: 100%;
  height: 100%;
}

/* CONTENEDOR PRINCIPAL ESTRICTO 1920x1080 (IDÉNTICO A KODI 1080i) */
#app {
  position: fixed;
  width: 1920px;
  height: 1080px;
  top: 0;
  left: 0;
  transform-origin: top left;
  display: flex;
  flex-direction: column;
  background: radial-gradient(circle at 50% 30%, #131722 0%, #0d0f14 85%);
  overflow: hidden;
}

/* 1. FRANJA SUPERIOR: LOGO + TABS + RELOJ (KODI XML: top 28-30) */
.top-header {
  height: 115px;
  background: #0b0e14;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 60px;
  flex-shrink: 0;
  z-index: 100;
}

.brand-title {
  font-size: 38px;
  font-weight: 900;
  letter-spacing: -0.5px;
  white-space: nowrap;
}
.brand-title span {
  color: var(--cyan);
}

.tabs-group {
  display: flex;
  gap: 16px;
  align-items: center;
}

.tab-btn {
  background: #141928;
  border: 1px solid var(--border-light);
  color: #d0d4dc;
  font-size: 26px;
  font-weight: 700;
  padding: 15px 36px;
  border-radius: 16px;
  cursor: pointer;
  outline: none;
  white-space: nowrap;
  transform: none !important;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.tab-btn:hover {
  background: #1a2238;
  color: #ffffff;
}

.tab-btn.active {
  background: linear-gradient(135deg, rgba(0, 229, 255, 0.28) 0%, rgba(0, 145, 234, 0.38) 100%);
  border: 3px solid var(--cyan);
  color: #ffffff;
}

.tab-btn:focus {
  border: 3px solid var(--cyan) !important;
  box-shadow: 0 0 25px var(--cyan-glow) !important;
  color: #ffffff !important;
  transform: none !important; /* CERO ZOOM */
}

.clock-display {
  font-size: 32px;
  font-weight: 700;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  white-space: nowrap;
}

/* 2. SUB-HEADER: TÍTULO SELECCIONADO + CONTADOR */
.sub-header {
  height: 85px;
  padding: 0 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2px solid rgba(0, 229, 255, 0.25);
  background: rgba(11, 14, 20, 0.95);
  flex-shrink: 0;
}

.info-selected {
  font-size: 30px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 80%;
  display: flex;
  align-items: center;
  gap: 14px;
}
.info-name {
  font-weight: 900;
  color: #ffffff;
}
.info-extra {
  display: inline-flex;
  align-items: center;
  background: rgba(0, 229, 255, 0.16);
  border: 1.5px solid var(--cyan);
  color: var(--cyan);
  font-size: 19px;
  font-weight: 800;
  padding: 4px 18px;
  border-radius: 20px;
  letter-spacing: 0.5px;
  margin-left: 8px;
}

.badge-counter {
  background: rgba(20, 25, 40, 0.95);
  border: 1.5px solid rgba(0, 229, 255, 0.4);
  border-radius: 12px;
  padding: 10px 28px;
  font-size: 22px;
  font-weight: 800;
  color: var(--cyan);
  white-space: nowrap;
  box-shadow: 0 0 16px rgba(0, 229, 255, 0.15);
}

/* 3. GRILLA PRINCIPAL DE CANALES (7 COLUMNAS EXACTAS TIPO KODI XML) */
.grid-container {
  flex: 1;
  overflow-y: auto;
  padding: 24px 60px;
  display: grid;
  grid-template-columns: repeat(7, 230px);
  gap: 20px 24px;
  justify-content: center;
  align-content: start;
}

/* Scrollbar estilizada invisible */
.grid-container::-webkit-scrollbar {
  width: 6px;
}
.grid-container::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 3px;
}

/* TARJETAS DE CANAL (230x185 EXACTAS DE KODI XML) */
.tv-card {
  width: 230px;
  height: 185px;
  background: #111820;
  border: 2px solid transparent;
  border-radius: 12px;
  padding: 10px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  position: relative;
  outline: none;
  transform: none !important; /* CERO ZOOM: TAMAÑO FIJO */
}

.tv-card:hover {
  background: #151e2b;
  border-color: rgba(0, 229, 255, 0.4);
}

.tv-card:focus, .tv-card.focused {
  background: #182535 !important;
  border: 3px solid #00e5ff !important; /* MARCO CIAN/BLANCO NÍTIDO TIPO KODI */
  box-shadow: 0 0 16px rgba(0, 229, 255, 0.6) !important;
  transform: none !important; /* CERO ZOOM: NO SE AGRANDA NI TAPA OTRAS TARJETAS */
  z-index: 5;
}

.card-logo-box {
  width: 194px;
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border-radius: 8px;
  padding: 4px;
}

.card-logo-box img {
  max-width: 180px;
  max-height: 110px;
  object-fit: contain;
}

.card-logo-ph {
  font-size: 60px;
}

.card-label {
  width: 218px;
  height: 32px;
  font-size: 13px;
  font-weight: 600;
  color: #b0b8c8;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 32px;
}

.tv-card:focus .card-label, .tv-card.focused .card-label {
  color: var(--cyan) !important;
  font-weight: 800 !important;
}

/* GRILLA ESPECIAL PARA AGENDA (5 COLUMNAS GRANDES PARA SMART TV) */
.grid-container.agenda-grid {
  grid-template-columns: repeat(5, 330px);
  gap: 24px 28px;
}

.grid-container.agenda-grid .tv-card {
  width: 330px;
  height: 235px;
  padding: 12px 14px;
}

.grid-container.agenda-grid .card-logo-box {
  width: 290px;
  height: 125px;
}

.grid-container.agenda-grid .card-logo-box img {
  max-width: 270px;
  max-height: 115px;
}

.grid-container.agenda-grid .card-logo-ph {
  font-size: 70px;
}

.grid-container.agenda-grid .card-label {
  width: 300px;
  height: 54px;
  font-size: 19px;
  font-weight: 700;
  line-height: 1.35;
  white-space: normal;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: center;
}

.grid-container.agenda-grid .agenda-banners-container {
  grid-column: 1 / span 5 !important;
}

/* EVENTOS / PARTIDOS ESPECÍFICOS */
.event-time-tag {
  font-size: 11px;
  color: var(--cyan);
  font-weight: 700;
  margin-bottom: 2px;
}

/* MODAL SEÑALES / ALTERNATIVAS SPLIT CON PUBLICIDAD */
#modalSignals {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.88);
  backdrop-filter: blur(8px);
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
}
#modalSignals.open {
  display: flex;
}
.modal-signals-box {
  background: #111824;
  border: 1px solid rgba(0, 229, 255, 0.35);
  border-radius: 18px;
  padding: 26px 32px;
  width: 860px;
  max-width: 95vw;
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.9), 0 0 35px rgba(0, 229, 255, 0.18);
  display: flex;
  flex-direction: column;
}
.modal-signals-title {
  font-size: 20px;
  font-weight: 800;
  color: var(--cyan);
  margin-bottom: 20px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.modal-signals-body {
  display: flex;
  gap: 24px;
  align-items: stretch;
  min-height: 250px;
}
.signals-list {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-height: 290px;
  overflow-y: auto;
  padding-right: 6px;
}
.signals-list::-webkit-scrollbar {

}
.signals-list::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.2);
  border-radius: 3px;
}
.signal-btn {
  background: var(--card-bg);
  border: 2px solid transparent;
  color: #ffffff;
  padding: 14px 18px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 700;
  text-align: left;
  cursor: pointer;
  outline: none;
  transition: all 0.15s ease;
  transform: none !important;
}
.signal-btn:focus, .signal-btn:hover {
  border-color: var(--cyan) !important;
  background: var(--card-focus) !important;
  box-shadow: 0 0 16px var(--cyan-glow) !important;

}
.modal-ad-side {
  width: 300px;
  height: 250px;
  flex-shrink: 0;
  background: rgba(11, 14, 20, 0.6);
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.modal-ad-bottom {
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 4. SPLASH OVERLAY INICIAL (10s con 3 banners) */
#splashOverlay {
  position: absolute;
  inset: 0;
  width: 1920px;
  height: 1080px;
  background: radial-gradient(circle at 50% 40%, #151d2c 0%, #090c14 90%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 1;
  transition: opacity 0.5s ease;
}
#splashOverlay.hide {
  opacity: 0;

}
.splash-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 12px;
}
.splash-logo {
  font-size: 56px;
  font-weight: 900;
  letter-spacing: -0.5px;
}
.splash-logo span {
  color: var(--cyan);
}
.splash-sub {
  font-size: 20px;
  color: #b0b8c8;
}
.splash-timer {
  font-size: 20px;
  font-weight: 700;
  color: #ffffff;
  background: rgba(0, 229, 255, 0.12);
  border: 1px solid rgba(0, 229, 255, 0.4);
  padding: 8px 26px;
  border-radius: 20px;
  margin-top: 4px;
}
.splash-banners-card {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  margin-top: 18px;
  background: rgba(14, 19, 30, 0.75);
  border: 1px solid rgba(255, 255, 255, 0.08);
  padding: 24px 32px;
  border-radius: 18px;
  box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6);
}
.splash-col-left {
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: center;
  justify-content: center;
}
.splash-col-right {
  display: flex;
  align-items: center;
  justify-content: center;
}
.splash-hint {
  font-size: 14px;
  color: var(--text-muted);
  margin-top: 10px;
}

/* ESTADOS DE CARGA Y VACÍO */
.state-center {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  min-height: 400px;
  color: var(--text-muted);
}
.spinner {
  width: 44px;
  height: 44px;
  border: 4px solid #1a2235;
  border-top-color: var(--cyan);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* TOAST */
#toastMsg {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: rgba(15, 20, 32, 0.95);
  border: 1px solid var(--cyan);
  border-radius: 10px;
  padding: 12px 24px;
  font-size: 14px;
  font-weight: 700;
  color: #ffffff;
  transition: transform 0.3s ease;
  z-index: 1000;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
}
#toastMsg.show {
  transform: translateX(-50%) translateY(0);
}
</style>
</head>

<script>
// ══════════════════════════════════════════════════════════════════
// 0. ESCALADO EXACTO 1920x1080 PARA CUALQUIER SMART TV / DENSITY
// ══════════════════════════════════════════════════════════════════
function resizeCanvas() {
  const app = document.getElementById('app');
  if (!app) return;
  const sw = window.innerWidth / 1920;
  const sh = window.innerHeight / 1080;
  const scale = Math.min(sw, sh);
  app.style.transform = `scale(${scale})`;
  app.style.left = `${(window.innerWidth - 1920 * scale) / 2}px`;
  app.style.top  = `${(window.innerHeight - 1080 * scale) / 2}px`;
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('DOMContentLoaded', resizeCanvas);
resizeCanvas();

// ══════════════════════════════════════════════════════════════════
// 1. CONFIGURACIÓN Y FUENTES EN LA NUBE (CLOUDFLARE PAGES)
// ══════════════════════════════════════════════════════════════════
const DATA_CLOUD_URL = 'https://latarr.shop/tv-app/data/';
const DATA_LOCAL_FALLBACK = 'data/';
const AGENDA_URL     = 'https://api.wqxag.com/diaries.json';
const IMG_BASE       = 'https://img.wqxag.com';
const REFERER_AGENDA = 'https://futbollibretvgol.org/';

const CAT_DEP = ['deportes', 'sports', 'deporte'];
const CAT_CIN = ['cine y series', 'peliculas', 'series', 'movies', 'cine'];
const CAT_INF = ['infantil', 'kids', 'ninos', 'niños'];
const CAT_MUS = ['musica', 'music', 'música'];

const FLAGS = {
  AR:'🇦🇷', BO:'🇧🇴', BR:'🇧🇷', CL:'🇨🇱', CO:'🇨🇴', CR:'🇨🇷', CU:'🇨🇺',
  DO:'🇩🇴', EC:'🇪🇨', ES:'🇪🇸', GT:'🇬🇹', HN:'🇭🇳', INT:'🌍', MX:'🇲🇽',
  NI:'🇳🇮', PA:'🇵🇦', PE:'🇵🇪', PR:'🇵🇷', PY:'🇵🇾', SV:'🇸🇻', US:'🇺🇸',
  UY:'🇺🇾', VE:'🇻🇪'
};

// ══════════════════════════════════════════════════════════════════
// 2. PUENTE NATIVO ANDROID (ExoPlayer + HttpURLConnection)
// ══════════════════════════════════════════════════════════════════
const NATIVE = !!(window.AndroidBridge && window.AndroidBridge.httpGet);
const _nat = {};
let _natId = 0;

window.__nat = function(id, ok, b64) {
  const cb = _nat[id];
  if (!cb) return;
  delete _nat[id];
  let txt = '';
  try {
    txt = new TextDecoder('utf-8').decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
  } catch(e) {}
  if (ok) cb.res(txt);
  else cb.rej(new Error(txt || 'error nativo'));
};

function nativeCall(fn, a, b) {
  return new Promise((res, rej) => {
    const id = 'n' + (++_natId);
    _nat[id] = { res, rej };
    setTimeout(() => {
      if (_nat[id]) { delete _nat[id]; rej(new Error('timeout')); }
    }, 25000);
    try {
      window.AndroidBridge[fn](id, a || '', b || '');
    } catch(e) {
      delete _nat[id]; rej(e);
    }
  });
}

function esc(t) {
  return String(t == null ? '' : t)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ══════════════════════════════════════════════════════════════════
// 3. ESTADO GLOBAL
// ══════════════════════════════════════════════════════════════════
let _paisesCache = null;
let _todosCanalesCache = null;
let _agendaCache = null;
let _currentItems = [];
let _currentTab = 'agenda';
let _isInsideCountry = false;
let _lastFocusedCardIdx = 0;

// ══════════════════════════════════════════════════════════════════
// 4. DESCARGA Y CACHÉ DE CANALES DESDE LA NUBE
// ══════════════════════════════════════════════════════════════════
async function fetchWithFallback(filename) {
  // 1. Intentar descargar desde la nube en latarr.shop
  try {
    const urlCloud = DATA_CLOUD_URL + filename;
    if (NATIVE) {
      const raw = await nativeCall('httpGet', urlCloud, 'https://latarr.shop/');
      return JSON.parse(raw);
    } else {
      const r = await fetch(urlCloud);
      if (r.ok) return await r.json();
    }
  } catch(err) {
    console.warn("Fallo nube para " + filename + ", intentando local...", err);
  }

  // 2. Si falla internet o la nube, usar el archivo empaquetado local de respaldo
  const rLocal = await fetch(DATA_LOCAL_FALLBACK + filename);
  return await rLocal.json();
}

async function getPaises() {
  if (!_paisesCache) {
    const data = await fetchWithFallback('paises.json');
    _paisesCache = data.paises || data;
  }
  return _paisesCache;
}

async function getCanalesPais(cod) {
  const data = await fetchWithFallback('tv_' + cod + '.json');
  return (data.canales || data).sort((a,b) => (a.nombre || '').localeCompare(b.nombre || ''));
}

async function getTodosCanales() {
  if (_todosCanalesCache) return _todosCanalesCache;
  const ps = await getPaises();
  const all = [];
  for (const p of ps) {
    try {
      const chs = await getCanalesPais(p.codigo);
      all.push(...chs);
    } catch(e) {}
  }
  _todosCanalesCache = all;
  return all;
}

async function getAgenda() {
  if (!_agendaCache) {
    let d;
    if (NATIVE) {
      d = JSON.parse(await nativeCall('httpGet', AGENDA_URL, REFERER_AGENDA));
    } else {
      const r = await fetch(AGENDA_URL);
      d = await r.json();
    }
    const list = Array.isArray(d) ? d : (d.data || []);
    list.sort((a, b) => {
      const ha = ((a.attributes || a).diary_hour || '99:99').slice(0, 5);
      const hb = ((b.attributes || b).diary_hour || '99:99').slice(0, 5);
      return ha.localeCompare(hb);
    });
    _agendaCache = list;
  }
  return _agendaCache;
}

// ══════════════════════════════════════════════════════════════════
// 5. RENDERIZADO DE VISTAS (IDÉNTICO A KODI)
// ══════════════════════════════════════════════════════════════════
function horaLocal(u) {
  if (!u) return '';
  const [h, m] = u.split(':');
  const lh = (parseInt(h, 10) + 2) % 24;
  return String(lh).padStart(2, '0') + ':' + (m || '00');
}

// Renderizar eventos deportivos
function renderAgendaView(evs) {
  _currentItems = evs;
  _isInsideCountry = false;
  const grid = document.getElementById('cardsGrid');
  grid.classList.add('agenda-grid');
  const badge = document.getElementById('infoBadgeCount');
  badge.textContent = evs.length + ' eventos hoy';

  if (!evs.length) {
    grid.innerHTML = '<div class="state-center"><div>📭</div><div>No hay eventos programados por el momento.</div></div>';
    updateSubHeader('', '');
    return;
  }

  const cardsHtml = evs.map((ev, i) => {
    const a = ev.attributes || ev;
    const name = String(a.diary_description || 'Evento').trim().replace(/\n/g, ' - ');
    const hour = horaLocal(a.diary_hour);
    const logoRaw = a.country?.data?.attributes?.image?.data?.attributes?.url || '';
    const logo = logoRaw ? (logoRaw.charAt(0) === '/' ? IMG_BASE + logoRaw : logoRaw) : '';
    const sigs = (a.embeds?.data || []).length;
    const labelTxt = (hour ? hour + '  ' : '') + name;

    return `
      <div class="tv-card" tabindex="0" data-idx="${i}" onclick="handleCardClick(${i})">
        <div class="card-logo-box">
          ${logo ? `<img src="${logo}" loading="lazy" onerror="this.outerHTML='<div class=\\'card-logo-ph\\'>⚽</div>'">` : `<div class="card-logo-ph">⚽</div>`}
        </div>
        <div class="card-label">${esc(labelTxt)}</div>

  const bannersHtml = `
    <div class="agenda-banners-container" style="grid-column: 1 / span 7; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 40px 0 60px 0; margin-top: 20px;">
      <iframe src="ad-728x90.html" style="width: 728px; height: 90px; border: none; overflow: hidden;" scrolling="no"></iframe>
      <iframe src="ad-468x60.html" style="width: 468px; height: 60px; border: none; overflow: hidden;" scrolling="no"></iframe>
    </div>

  grid.innerHTML = cardsHtml + bannersHtml;

  focusFirstCard();
}

// ══════════════════════════════════════════════════════════════════
// 6. ACCIONES Y REPRODUCCIÓN
// ══════════════════════════════════════════════════════════════════
async function handleCardClick(i) {
  _lastFocusedCardIdx = i;
  const item = _currentItems[i];
  if (!item) return;

  // Si estamos en la pestaña Mundial y hace clic en un país:
  if (_currentTab === 'mundial' && !_isInsideCountry) {
    _isInsideCountry = true;
    showLoading("Cargando canales de " + (item.nombre || item.codigo) + "...");
    const channels = await getCanalesPais(item.codigo);
    renderCanalesView(channels, item.nombre || item.codigo);
    return;
  }

  // Si estamos en Agenda (Evento deportivo):
  if (_currentTab === 'agenda') {
    const a = item.attributes || item;
    const name = String(a.diary_description || 'Evento').trim().replace(/\n/g, ' - ');
    const embeds = a.embeds?.data || [];
    if (!embeds.length) {
      toast("⚠️ No hay señales disponibles para este evento");
      return;
    }
    if (embeds.length === 1) {
      resolveAndPlayNative(embeds[0], name);
      return;
    }
    // Abrir modal de selección de señales
    openSignalsModal(name, embeds);
    return;
  }

  // Si es un canal directo de TV:
  if (!item.url) {
    toast("❌ Canal sin enlace directo");
    return;
  }
  playChannelNative(item.url, item.nombre || 'Canal', item.alternativas || []);
}

let _activeEmbeds = [];
let _activeTitle = '';

function openSignalsModal(title, embeds) {
  _activeEmbeds = embeds;
  _activeTitle = title;
  const modal = document.getElementById('modalSignals');
  document.getElementById('modalSignalsTitle').textContent = '📡 ' + title;
  const list = document.getElementById('signalsList');
  list.innerHTML = embeds.map((em, idx) => `
    <button class="signal-btn" tabindex="0" onclick="handleSignalClick(${idx})">
      ⚡ Señal ${idx + 1}: ${esc(em.attributes?.embed_name || 'Opción ' + (idx + 1))}
    </button>
  `).join('');

  // Cargar anuncios de forma dinámica al abrir el modal
  const ad300 = document.getElementById('modalAd300');
  const ad468 = document.getElementById('modalAd468');
  if (ad300) ad300.src = 'ad-300x250.html';
  if (ad468) ad468.src = 'ad-468x60.html';

  modal.classList.add('open');
  list.querySelector('.signal-btn')?.focus();
}

function handleSignalClick(idx) {
  closeSignalsModal(true);
  const em = _activeEmbeds[idx];
  if (em) {
    resolveAndPlayNative(em, _activeTitle);
  }
}

function closeSignalsModal(shouldRestoreFocus = true) {
  const modal = document.getElementById('modalSignals');
  modal.classList.remove('open');
  // Detener y limpiar anuncios para optimizar memoria y cumplir políticas
  const ad300 = document.getElementById('modalAd300');
  const ad468 = document.getElementById('modalAd468');
  if (ad300) ad300.src = 'about:blank';
  if (ad468) ad468.src = 'about:blank';

  if (shouldRestoreFocus) {
    restoreLastCardFocus();
  }
}

function restoreLastCardFocus() {
  setTimeout(() => {
    const card = document.querySelector(`#cardsGrid .tv-card[data-idx="${_lastFocusedCardIdx}"]`);
    if (card) {
      card.focus();
      onCardFocus(_lastFocusedCardIdx);
      card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }, 50);
}

function decodeEmbedUrl(raw) {
  if (raw.indexOf('?r=') < 0 && raw.indexOf('&r=') < 0) return raw;
  let b = raw.split(/[?&]r=/).pop().split('&')[0].trim();
  try { b = decodeURIComponent(b); } catch(e) {}
  b = b.replace(/-/g, '+').replace(/_/g, '/');
  while (b.length % 4) b += '=';
  try { return atob(b).trim(); } catch(e) { return raw; }
}

async function resolveAndPlayNative(em, name) {
  toast("⏳ Resolviendo señal...");
  try {
    const iframeRaw = em?.attributes?.embed_iframe || em?.embed_iframe || '';
    if (!iframeRaw) throw new Error("Sin iframe");
    if (/\.m3u8/i.test(iframeRaw) && /^https?:/i.test(iframeRaw)) {
      playChannelNative(iframeRaw, name, []);
      return;
    }
    const tv90url = decodeEmbedUrl(iframeRaw);
    if (!/^https?:/i.test(tv90url)) throw new Error("URL no válida");

    if (NATIVE) {
      const r = JSON.parse(await nativeCall('resolveStream', tv90url));
      if (!r || !r.url) throw new Error("Sin stream");
      playChannelNative(r.url, name, [], r.referer);
    }
  } catch(err) {
    toast("❌ No se pudo conectar con la señal");
  }
}

function playChannelNative(url, title, alts, referer) {
  if (NATIVE && window.AndroidBridge.play) {
    const list = (alts || []).map(a => typeof a === 'string' ? a : (a && a.url)).filter(Boolean);
    window.AndroidBridge.play(url, title || '', JSON.stringify(list), referer || '');
  }
}

// ══════════════════════════════════════════════════════════════════
// 7. CONTROL REMOTO D-PAD & NAVEGACIÓN PRECISA
// ══════════════════════════════════════════════════════════════════
function updateSubHeader(name, extra) {
  document.getElementById('infoName').textContent = name || '';
  const ex = document.getElementById('infoExtra');
  if (extra) {
    ex.textContent = extra;
    ex.style.display = 'inline-flex';
  } else {
    ex.textContent = '';
    ex.style.display = 'none';
  }
}

function onCardFocus(idx) {
  _lastFocusedCardIdx = idx;
  const item = _currentItems[idx];
  if (!item) return;

  if (_currentTab === 'agenda') {
    const a = item.attributes || item;
    const name = String(a.diary_description || 'Evento').trim().replace(/\n/g, ' - ');
    const hour = horaLocal(a.diary_hour);
    const sigs = (a.embeds?.data || []).length;
    const sigLabel = sigs === 1 ? '⚡ 1 SEÑAL DISPONIBLE' : `⚡ ${sigs} SEÑALES DISPONIBLES`;
    updateSubHeader(hour ? `${hour} · ${name}` : name, sigLabel);
  } else if (_currentTab === 'mundial' && !_isInsideCountry) {
    updateSubHeader(item.nombre || item.codigo, `${item.total || 0} CANALES`);
  } else {
    updateSubHeader(item.nombre || 'Canal', item.categoria || 'EN VIVO');
  }
}

function focusFirstCard() {
  setTimeout(() => {
    const first = document.querySelector('#cardsGrid .tv-card');
    if (first) {
      first.focus();
      onCardFocus(0);
    }
  }, 50);
}

// Cambiar de pestaña
async function switchTab(tab) {
  _currentTab = tab;
  _isInsideCountry = false;

  document.querySelectorAll('#topTabs .tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });

  showLoading("Cargando sección...");

  if (tab === 'agenda') {
    renderAgendaView(await getAgenda());
  } else if (tab === 'deportes') {
    const all = await getTodosCanales();
    renderCanalesView(all.filter(c => CAT_DEP.includes((c.categoria || '').toLowerCase().trim())));
  } else if (tab === 'cine') {
    const all = await getTodosCanales();
    renderCanalesView(all.filter(c => CAT_CIN.includes((c.categoria || '').toLowerCase().trim())));
  } else if (tab === 'chile') {
    renderCanalesView(await getCanalesPais('CL'));
  } else if (tab === 'infantil') {
    const all = await getTodosCanales();
    renderCanalesView(all.filter(c => CAT_INF.includes((c.categoria || '').toLowerCase().trim())));
  } else if (tab === 'mundial') {
    renderPaisesView(await getPaises());
  } else if (tab === 'musica') {
    const all = await getTodosCanales();
    renderCanalesView(all.filter(c => CAT_MUS.includes((c.categoria || '').toLowerCase().trim())));
  }
}

function showLoading(msg) {
  document.getElementById('cardsGrid').innerHTML = `
    <div class="state-center">
      <div class="spinner"></div>
      <div>${msg}</div>
    </div>
  `;
}

// ══════════════════════════════════════════════════════════════════
// 7. CONTROL DEL SPLASH DE BIENVENIDA (10 SEGUNDOS)
// ══════════════════════════════════════════════════════════════════
let _splashSeconds = 10;
let _splashTimer = null;

function dismissSplash() {
  if (_splashTimer) {
    clearInterval(_splashTimer);
    _splashTimer = null;
  }
  const overlay = document.getElementById('splashOverlay');
  if (!overlay || overlay.classList.contains('hide')) return;
  overlay.classList.add('hide');
  setTimeout(() => {
    overlay.style.display = 'none';
    focusFirstCard();
  }, 500);
}

function startSplashTimer() {
  const secSpan = document.getElementById('splashSeconds');
  _splashTimer = setInterval(() => {
    _splashSeconds--;
    if (secSpan) secSpan.textContent = _splashSeconds;
    if (_splashSeconds <= 0) {
      dismissSplash();
    }
  }, 1000);
}

// MOTOR DE TECLADO / D-PAD
document.addEventListener('keydown', e => {
  // SI EL SPLASH ESTÁ ACTIVO, SE BLOQUEAN TODAS LAS TECLAS HASTA QUE SE CUMPLAN LOS 10 SEGUNDOS
  const splash = document.getElementById('splashOverlay');
  if (splash && !splash.classList.contains('hide') && splash.style.display !== 'none') {
    e.preventDefault();
    return;
  }

  const modal = document.getElementById('modalSignals');
  const isModalOpen = modal.classList.contains('open');

  // BOTÓN ATRÁS (Escape / Backspace)
  if (e.key === 'Escape' || e.key === 'Backspace' || e.keyCode === 10009 || e.keyCode === 27) {
    e.preventDefault();
    if (isModalOpen) {
      closeSignalsModal(true);
      return;
    }
    if (_isInsideCountry) {
      // Si estaba adentro de un país en Mundial, volver a la grilla de banderas
      _isInsideCountry = false;
      getPaises().then(renderPaisesView);
      return;
    }
    // Si está en la raíz, llamar a Android para confirmar salida
    if (window.AndroidBridge && window.AndroidBridge.finish) {
      window.AndroidBridge.finish();
    }
    return;
  }

  // TECLA ENTER / OK
  if (e.key === 'Enter' || e.keyCode === 13) {
    e.preventDefault();
    if (document.activeElement && document.activeElement !== document.body) {
      document.activeElement.click();
    }
    return;
  }

  // NAVEGACIÓN D-PAD EN MODAL
  if (isModalOpen) {
    const btns = [...modal.querySelectorAll('.signal-btn')];
    const idx = btns.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' && idx < btns.length - 1) { btns[idx + 1].focus(); e.preventDefault(); }
    if (e.key === 'ArrowUp' && idx > 0) { btns[idx - 1].focus(); e.preventDefault(); }
    return;
  }

  // NAVEGACIÓN D-PAD EN LA APLICACIÓN PRINCIPAL
  const tabs = [...document.querySelectorAll('#topTabs .tab-btn')];
  const cards = [...document.querySelectorAll('#cardsGrid .tv-card')];
  const activeEl = document.activeElement;

  const inTabs = tabs.includes(activeEl);
  const cardIdx = cards.indexOf(activeEl);

  // 1. SI ESTÁ EN LAS PESTAÑAS SUPERIORES
  if (inTabs) {
    const tabIdx = tabs.indexOf(activeEl);
    if (e.key === 'ArrowRight' && tabIdx < tabs.length - 1) {
      tabs[tabIdx + 1].focus();
      e.preventDefault();
    } else if (e.key === 'ArrowLeft' && tabIdx > 0) {
      tabs[tabIdx - 1].focus();
      e.preventDefault();
    } else if (e.key === 'ArrowDown') {
      // Bajar al primer elemento de la grilla
      if (cards.length > 0) {
        cards[0].focus();
        onCardFocus(0);
        cards[0].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
      e.preventDefault();
    }
    return;
  }

  // 2. SI ESTÁ EN LA GRILLA DE CANALES (5 COLUMNAS EN AGENDA, 7 EN CANALES)
  if (cardIdx >= 0) {
    const COLS = (_currentTab === 'agenda') ? 5 : 7;
    let nextIdx = -1;

    if (e.key === 'ArrowRight' && cardIdx < cards.length - 1) {
      nextIdx = cardIdx + 1;
    } else if (e.key === 'ArrowLeft' && cardIdx > 0) {
      nextIdx = cardIdx - 1;
    } else if (e.key === 'ArrowDown') {
      if (cardIdx + COLS < cards.length) {
        nextIdx = cardIdx + COLS;
      } else {
        const b = document.querySelector('.agenda-banners-container');
        if (b) {
          b.scrollIntoView({ block: 'end', behavior: 'smooth' });
          e.preventDefault();
          return;
        }
      }
    } else if (e.key === 'ArrowUp') {
      if (cardIdx < COLS) {
        // Primera fila: subir a las pestañas superiores
        const activeTab = document.querySelector('#topTabs .tab-btn.active') || tabs[0];
        if (activeTab) activeTab.focus();
        e.preventDefault();
        return;
      } else {
        nextIdx = cardIdx - COLS;
      }
    }

    if (nextIdx >= 0 && cards[nextIdx]) {
      cards[nextIdx].focus();
      onCardFocus(nextIdx);
      cards[nextIdx].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      e.preventDefault();
    }
  }
});

// Botón Atrás nativo de Android
window.nativeBack = function() {
  const modal = document.getElementById('modalSignals');
  if (modal.classList.contains('open')) { closeSignalsModal(true); return true; }
  if (_isInsideCountry) { _isInsideCountry = false; getPaises().then(renderPaisesView); return true; }
  return false;
};

// Restaurar foco al volver de ExoPlayer / segundo plano
window.addEventListener('focus', () => {
  const active = document.activeElement;
  const inTabs = document.querySelector('#topTabs')?.contains(active);
  const inCards = document.querySelector('#cardsGrid')?.contains(active);
  const inModal = document.querySelector('#modalSignals')?.classList.contains('open');
  if (!inTabs && !inCards && !inModal) {
    restoreLastCardFocus();
  }
});

// RELOJ EN TIEMPO REAL
function updateClock() {
  const now = new Date();
  let h = now.getHours();
  const m = String(now.getMinutes()).padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  document.getElementById('clockDisplay').textContent = `${h}:${m} ${ampm}`;
}
setInterval(updateClock, 1000);
updateClock();

// AJUSTE AUTOMÁTICO DE ESCALA (SMART TV, TELÉFONO EN HORIZONTAL, MONITOR)
function fitScreen() {
  const app = document.getElementById('app');
  if (!app) return;
  const w = window.innerWidth;
  const h = window.innerHeight;
  if (w && h) {
    const scale = Math.min(w / 1920, h / 1080);
    app.style.transform = `scale(${scale})`;
    app.style.left = `${Math.max(0, (w - 1920 * scale) / 2)}px`;
    app.style.top = `${Math.max(0, (h - 1080 * scale) / 2)}px`;
  }
}
window.addEventListener('resize', fitScreen);
window.addEventListener('orientationchange', fitScreen);

// INICIALIZACIÓN
window.addEventListener('load', () => {
  fitScreen();
  // Asignar clics a las pestañas
  document.querySelectorAll('#topTabs .tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  // Iniciar temporizador del Splash de 10s
  startSplashTimer();

  // Cargar primera pestaña (Eventos deportivos)
  switchTab('agenda');
});

function toast(msg) {
  const t = document.getElementById('toastMsg');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
