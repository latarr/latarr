<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Latarr TV PRO</title>
<style>
:root{--bg:#0a0d16;--bg2:#0f1420;--card:#141928;--card2:#1a2035;--cyan:#00e5ff;--cyan2:#0091ea;--text:#e8eaf6;--muted:#8892a4;--radius:12px;--focus:0 0 0 3px rgba(0,229,255,.75);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh;width:100vw;}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:1000;background:linear-gradient(135deg,#060810,#0a0d16,#060a18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px;}
.sp-logo{display:flex;align-items:center;gap:14px;animation:fadeDown .8s ease both;}
.sp-logo img{width:72px;height:72px;border-radius:18px;box-shadow:0 8px 32px rgba(0,229,255,.3);}
.sp-title{font-size:36px;font-weight:900;letter-spacing:-1px;}
.sp-title span{color:var(--cyan);}
.sp-sub{font-size:12px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}
.sp-stats{display:flex;gap:20px;animation:fadeUp .8s ease .2s both;}
.sp-stat{background:var(--card);border:1px solid rgba(0,229,255,.15);border-radius:10px;padding:10px 18px;text-align:center;}
.sp-num{font-size:20px;font-weight:900;color:var(--cyan);}
.sp-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
/* Adsterra slots splash */
.sp-banners{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center;animation:fadeUp .8s ease .3s both;max-width:960px;}
.sp-banner{background:var(--card);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.sp-countdown{display:flex;flex-direction:column;align-items:center;gap:6px;animation:fadeUp .8s ease .4s both;}
.cd-ring{width:64px;height:64px;position:relative;}
.cd-ring svg{transform:rotate(-90deg);}
.cd-ring circle{fill:none;stroke:var(--card2);stroke-width:5;}
.cd-ring circle.prog{stroke:var(--cyan);stroke-linecap:round;stroke-dasharray:188;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear;}
.cd-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:var(--cyan);}
.sp-msg{font-size:11px;color:var(--muted);}

/* APP */
#app{display:none;flex-direction:column;height:100vh;}

/* HEADER */
.hdr{background:var(--bg2);border-bottom:1px solid rgba(255,255,255,.07);
  padding:0 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;height:52px;}
.brand{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.brand img{width:30px;height:30px;border-radius:8px;}
.brand-name{font-size:14px;font-weight:900;white-space:nowrap;}
.brand-name span{color:var(--cyan);}
.back-btn{padding:6px 12px;border-radius:7px;border:1px solid rgba(0,229,255,.3);
  background:transparent;color:var(--cyan);font-size:12px;font-weight:700;cursor:pointer;display:none;flex-shrink:0;}
.back-btn.show{display:block;}
.back-btn:focus{outline:none;box-shadow:var(--focus);}
.tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:7px 12px;border-radius:7px;border:none;background:transparent;color:var(--muted);
  font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.12s;flex-shrink:0;}
.tab:hover{background:var(--card);color:var(--text);}
.tab.active{background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#000;}
.tab:focus{outline:none;box-shadow:var(--focus);}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:14px;scrollbar-width:thin;scrollbar-color:var(--card2) transparent;}
.content::-webkit-scrollbar{width:5px;}
.content::-webkit-scrollbar-thumb{background:var(--card2);border-radius:3px;}

/* GRIDS */
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
.ev-card{background:var(--card);border-radius:var(--radius);padding:12px;cursor:pointer;
  display:flex;flex-direction:column;gap:7px;border:2px solid transparent;transition:.12s;}
.ev-card:hover,.ev-card:focus{border-color:var(--cyan);outline:none;box-shadow:0 6px 20px rgba(0,229,255,.2);transform:scale(1.02);}
.ev-card img{width:100%;height:64px;object-fit:contain;border-radius:7px;background:var(--bg2);}
.ev-time{font-size:11px;color:var(--cyan);font-weight:700;}
.ev-name{font-size:12px;font-weight:700;line-height:1.3;}
.ev-sigs{font-size:11px;color:var(--muted);}

/* Lista de canales (tipo addon Kodi — una fila por canal) */
.ch-list{display:flex;flex-direction:column;gap:6px;}
.ch-row{background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer;
  display:flex;align-items:center;gap:12px;border:2px solid transparent;transition:.12s;}
.ch-row:hover,.ch-row:focus{border-color:var(--cyan);outline:none;background:var(--card2);box-shadow:0 4px 16px rgba(0,229,255,.15);}
.ch-row-logo{width:40px;height:40px;object-fit:contain;border-radius:7px;background:var(--bg2);flex-shrink:0;}
.ch-row-logo-ph{width:40px;height:40px;border-radius:7px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.ch-row-info{flex:1;min-width:0;}
.ch-row-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ch-row-cat{font-size:11px;color:var(--muted);}
.ch-row-play{color:var(--cyan);font-size:18px;flex-shrink:0;}

.pa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.pa-card{background:var(--card);border-radius:var(--radius);padding:14px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;border:2px solid transparent;transition:.12s;}
.pa-card:hover,.pa-card:focus{border-color:var(--cyan);outline:none;transform:scale(1.03);}
.pa-flag{font-size:36px;}
.pa-name{font-size:12px;font-weight:700;text-align:center;}
.pa-tot{font-size:10px;color:var(--muted);}

/* PLAYER INLINE */
#player-wrap{position:fixed;inset:0;z-index:800;background:#000;display:none;flex-direction:column;}
#player-wrap.open{display:flex;}
.player-hdr{background:rgba(0,0,0,.7);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.player-title{flex:1;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-close{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:7px;padding:6px 14px;cursor:pointer;font-size:13px;font-weight:700;}
.player-close:focus{outline:none;box-shadow:var(--focus);}
#player-video{flex:1;width:100%;background:#000;}
.player-err{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);}
.player-err .icon{font-size:48px;}
.player-err p{font-size:14px;}

/* MODAL */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:900;display:none;align-items:center;justify-content:center;}
#modal.open{display:flex;}
.modal-box{background:var(--bg2);border-radius:16px;padding:22px;width:min(400px,90vw);border:1px solid rgba(0,229,255,.2);box-shadow:0 24px 64px rgba(0,0,0,.8);}
.modal-title{font-size:14px;font-weight:800;margin-bottom:14px;color:var(--cyan);}
.sig-list{display:flex;flex-direction:column;gap:7px;}
.sig-btn{padding:12px 14px;background:var(--card);border:2px solid transparent;border-radius:9px;
  color:var(--text);font-size:13px;font-weight:600;cursor:pointer;text-align:left;transition:.12s;}
.sig-btn:hover,.sig-btn:focus{border-color:var(--cyan);outline:none;background:var(--card2);}

/* TOAST */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);
  background:rgba(15,20,32,.97);border:1px solid rgba(0,229,255,.3);border-radius:10px;
  padding:11px 18px;font-size:13px;font-weight:600;color:var(--text);
  transition:transform .3s;z-index:999;white-space:nowrap;backdrop-filter:blur(10px);}
#toast.show{transform:translateX(-50%) translateY(0);}

.state-box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:48px;color:var(--muted);min-height:200px;}
.state-box .icon{font-size:44px;}
.spinner{width:34px;height:34px;border:3px solid var(--card2);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-18px);}to{opacity:1;transform:none;}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="sp-logo">
    <img src="../icon.png" onerror="this.style.display='none'" alt="Latarr">
    <div>
      <div class="sp-title">LATARR <span>TV PRO</span></div>

    <div class="sp-stat"><div class="sp-num">2457</div><div class="sp-lbl">Canales</div></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>

<script>
// ═══ CONFIG ═══
const DATA   = 'data/';
const AGENDA_URL = 'https://api.wqxag.com/diaries.json';
const IMG_BASE   = 'https://img.wqxag.com';
const PROXIES = [
  u => 'https://corsproxy.io/?' + encodeURIComponent(u),
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://thingproxy.freeboard.io/fetch/' + u,
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
];
const CAT_DEP = ['deportes','sports','deporte'];
const CAT_CIN = ['cine y series','peliculas','series','movies','cine'];
const CAT_INF = ['infantil','kids','ninos','niños'];
const CAT_MUS = ['musica','music','música'];
const FLAGS   = {AR:'🇦🇷',BO:'🇧🇴',BR:'🇧🇷',CL:'🇨🇱',CO:'🇨🇴',CR:'🇨🇷',CU:'🇨🇺',DO:'🇩🇴',EC:'🇪🇨',ES:'🇪🇸',GT:'🇬🇹',HN:'🇭🇳',INT:'🌍',MX:'🇲🇽',NI:'🇳🇮',PA:'🇵🇦',PE:'🇵🇪',PR:'🇵🇷',PY:'🇵🇾',SV:'🇸🇻',US:'🇺🇸',UY:'🇺🇾',VE:'🇻🇪'};

// ═══ ESTADO ═══
let _todos=null, _paises=null, _agenda=null;
let _curTab='agenda', _viewMode='agenda', _stack=[];
let _hlsInst=null;

// ═══ SPLASH ═══
const CIRC = 2*Math.PI*28, SECS=10;
let secsLeft=SECS, splashTmr=null;

function startCountdown(){
  const ring=document.getElementById('progRing'), num=document.getElementById('cdNum');
  ring.style.strokeDasharray=CIRC; ring.style.strokeDashoffset=0;
  splashTmr=setInterval(()=>{
    secsLeft--;
    num.textContent=secsLeft;
    ring.style.strokeDashoffset=CIRC*(1-secsLeft/SECS);
    if(secsLeft<=0){clearInterval(splashTmr);enterApp();}
  },1000);
  document.getElementById('splash').addEventListener('click',()=>{clearInterval(splashTmr);enterApp();});
}
function enterApp(){
  const sp=document.getElementById('splash');
  sp.style.opacity='0'; sp.style.transition='opacity .4s';
  setTimeout(()=>{
    sp.style.display='none';
    const app=document.getElementById('app'); app.style.display='flex';
    document.querySelectorAll('.tab').forEach(btn=>{
      btn.addEventListener('click',()=>switchTab(btn.dataset.tab, btn));
    });
    loadTab('agenda');
    setTimeout(()=>focusFirst('#tabs'),400);
  },400);
}

// ═══ DATOS ═══
async function fetchJson(url){
  const r=await fetch(url); if(!r.ok) throw new Error('HTTP '+r.status); return r.json();
}
async function proxyFetch(url){
  for(const p of PROXIES){
    try{
      const r=await fetch(p(url),{signal:AbortSignal.timeout(12000)});
      if(r.ok) return r.text();
    }catch(e){}
  }
  throw new Error('Todos los proxies fallaron');
}
async function getPaises(){if(!_paises){const d=await fetchJson(DATA+'paises.json');_paises=d.paises||d;}return _paises;}
async function getCanalesPais(cod){const d=await fetchJson(DATA+'tv_'+cod+'.json');return(d.canales||d).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));}
async function getTodos(){
  if(_todos)return _todos;
  const ps=await getPaises(); const all=[];
  for(const p of ps){try{const ch=await getCanalesPais(p.codigo);all.push(...ch);}catch(e){}}
  _todos=all; return all;
}
async function getAgenda(){if(!_agenda){const d=await fetchJson(AGENDA_URL);_agenda=Array.isArray(d)?d:(d.data||[]);}return _agenda;}

// ═══ TABS ═══
function switchTab(tab, btn){
  _curTab=tab; _stack=[]; _viewMode=tab==='mundial'?'paises':'grid';
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.getElementById('backBtn').classList.remove('show');
  loadTab(tab);
}
async function loadTab(tab){
  showSpinner();
  try{
    if(tab==='agenda'){_viewMode='agenda';renderAgenda(await getAgenda());}
    else if(tab==='chile'){renderCanales(await getCanalesPais('CL'));}
    else if(tab==='deportes'){const t=await getTodos();renderCanales(t.filter(c=>CAT_DEP.includes((c.categoria||'').toLowerCase().trim())));}
    else if(tab==='cine'){const t=await getTodos();renderCanales(t.filter(c=>CAT_CIN.includes((c.categoria||'').toLowerCase().trim())));}
    else if(tab==='infantil'){const t=await getTodos();renderCanales(t.filter(c=>CAT_INF.includes((c.categoria||'').toLowerCase().trim())));}
    else if(tab==='musica'){const t=await getTodos();renderCanales(t.filter(c=>CAT_MUS.includes((c.categoria||'').toLowerCase().trim())));}
    else if(tab==='mundial'){_viewMode='paises';renderPaises(await getPaises());}
    setTimeout(()=>focusFirstContent(),150);
  }catch(e){document.getElementById('content').innerHTML=`<div class="state-box"><div class="icon">⚠️</div><p>Error al cargar.</p></div>`;}
}

// ═══ RENDER AGENDA ═══
function horaLocal(u){if(!u)return'';const[h,m]=u.split(':');const lh=(parseInt(h,10)-3+24)%24;return String(lh).padStart(2,'0')+':'+(m||'00');}
function renderAgenda(evs){
  const c=document.getElementById('content');
  if(!evs.length){c.innerHTML=`<div class="state-box"><div class="icon">📭</div><p>Sin eventos hoy.</p></div>`;return;}
  c.innerHTML=`<div class="ev-grid">${evs.map((ev,i)=>{
    const a=ev.attributes||ev;
    const name=a.diary_description||'Evento';
    const hour=horaLocal(a.diary_hour);
    const logoRaw=a.country?.data?.attributes?.image?.data?.attributes?.url||'';
    const logo=logoRaw?(IMG_BASE+logoRaw):'';
    const sigs=(a.embeds?.data||[]).length;
    return `<div class="ev-card" tabindex="0" onclick="openEvento(${i})" onkeydown="if(event.key==='Enter')openEvento(${i})">
      ${logo?`<img src="${logo}" alt="${name}" loading="lazy" onerror="this.style.display='none'">`:''} 
      <div class="ev-time">${hour?'🕐 '+hour+' hs':''}</div>
      <div class="ev-name">${name}</div>
      <div class="ev-sigs">📡 ${sigs} señal${sigs!==1?'es':''}</div>
    </div>`;
  }).join('')}</div>`;
}
function openEvento(i){
  const ev=(_agenda||[])[i]; if(!ev)return;
  const a=ev.attributes||ev;
  const name=a.diary_description||'Evento';
  const embeds=a.embeds?.data||[];
  if(!embeds.length){toast('⚠️ Sin señales');return;}
  if(embeds.length===1){resolveAndPlay(embeds[0],name);return;}
  showModal('📡 '+name, embeds.map((em,j)=>({label:em.attributes?.embed_name||'Señal '+(j+1), fn:()=>resolveAndPlay(em,name)})));
}
async function resolveAndPlay(em,nombre){
  toast('⏳ Resolviendo señal...');
  try{
    const iframeRaw=em?.attributes?.embed_iframe||em?.embed_iframe||'';
    if(!iframeRaw)throw new Error('Sin iframe');

    // Si es m3u8 directo
    if(iframeRaw.match(/\.m3u8/i)){playVideo(iframeRaw,nombre);return;}

    // Extraer URL del parámetro ?r= (base64)
    let tv90url='';
    const match=iframeRaw.match(/[?&]r=([^&"']+)/);
    if(match) tv90url=atob(decodeURIComponent(match[1]));
    else if(iframeRaw.startsWith('http')) tv90url=iframeRaw;
    else throw new Error('URL no reconocida');

    // Paso 1: obtener página que tiene el iframe interno
    const h1=await proxyFetch(tv90url);

    // Buscar m3u8 directo en el HTML
    const m3uDirect=h1.match(/["'](https?:\/\/[^"']+\.m3u8[^"']*)/i);
    if(m3uDirect){playVideo(m3uDirect[1],nombre);return;}

    // Buscar iframe interno con 5.php
    const if1=h1.match(/iframe[^>]+src=["']([^"']*5\.php[^"']*)/i);
    if(!if1)throw new Error('No iframe interno');
    const innerUrl=if1[1].startsWith('http')?if1[1]:new URL(if1[1],tv90url).href;

    // Paso 2: obtener página del iframe
    const h2=await proxyFetch(innerUrl);
    const m3u=h2.match(/["'](https?:\/\/[^"']+\.m3u8[^"']*)/i);
    if(!m3u)throw new Error('No m3u8');
    playVideo(m3u[1],nombre);
  }catch(e){toast('❌ No se pudo resolver la señal');}
}

// ═══ RENDER CANALES (lista estilo addon Kodi) ═══
function renderCanales(chs){
  const c=document.getElementById('content');
  if(!chs.length){c.innerHTML=`<div class="state-box"><div class="icon">📡</div><p>Sin canales.</p></div>`;return;}
  c.innerHTML=`<div class="ch-list">${chs.map((ch,i)=>{
    const logo=ch.logo&&ch.logo.startsWith('http')?ch.logo:'';
    const nombre=ch.nombre||'Canal';
    const nSafe=nombre.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    const url=(ch.url||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    const alts=JSON.stringify(ch.alternativas||[]).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return `<div class="ch-row" tabindex="0"
      onclick="playCanal('${url}','${nSafe}','${alts}')"
      onkeydown="if(event.key==='Enter')playCanal('${url}','${nSafe}','${alts}')">
      ${logo
        ?`<img class="ch-row-logo" src="${logo}" alt="${nSafe}" loading="lazy" onerror="this.outerHTML='<div class=\\'ch-row-logo-ph\\'>📺</div>'">`
        :`<div class="ch-row-logo-ph">📺</div>`
      }
      <div class="ch-row-info">
        <div class="ch-row-name">${nombre}</div>
        ${ch.categoria?`<div class="ch-row-cat">${ch.categoria}</div>`:''}
      </div>
      <div class="ch-row-play">▶</div>
    </div>`;
  }).join('')}</div>`;
}
function playCanal(url,nombre,altsStr){
  if(!url){toast('❌ Sin enlace');return;}
  let alts=[];
  try{alts=JSON.parse(altsStr);}catch(e){}
  playVideo(url,nombre,alts);
}

// ═══ RENDER PAÍSES ═══
function renderPaises(ps){
  const c=document.getElementById('content');
  c.innerHTML=`<div class="pa-grid">${ps.map((p,i)=>{
    const f=FLAGS[p.codigo]||'📺';
    return `<div class="pa-card" tabindex="0"
      onclick="openPais('${p.codigo}','${(p.nombre||p.codigo).replace(/'/g,"\\'")}',${p.total||0})"
      onkeydown="if(event.key==='Enter')openPais('${p.codigo}','${(p.nombre||p.codigo).replace(/'/g,"\\'")}',${p.total||0})">
      <div class="pa-flag">${f}</div>
      <div class="pa-name">${p.nombre||p.codigo}</div>
      <div class="pa-tot">${p.total||0} canales</div>
    </div>`;
  }).join('')}</div>`;
}
async function openPais(cod,nombre,total){
  _stack.push({mode:'paises'});
  document.getElementById('backBtn').classList.add('show');
  _viewMode='pais';
  showSpinner();
  try{const ch=await getCanalesPais(cod);renderCanales(ch);setTimeout(()=>focusFirstContent(),150);}
  catch(e){toast('❌ Error cargando '+nombre);}
}
function goBack(){
  _stack.pop();
  if(!_stack.length) document.getElementById('backBtn').classList.remove('show');
  _viewMode='paises';
  getPaises().then(renderPaises).then(()=>setTimeout(()=>focusFirstContent(),150));
}

// ═══ REPRODUCCIÓN ═══
function playVideo(url,nombre,alts){
  // 1. Android Bridge (APK nativa con WebView)
  if(window.AndroidBridge?.playVideo){
    window.AndroidBridge.playVideo(url);
    return;
  }
  // 2. Player HLS inline (Smart TV browser, PC, etc.)
  openPlayer(url, nombre||'Canal', alts||[]);
}

function openPlayer(url, titulo, alts){
  document.getElementById('player-title').textContent=titulo;
  const wrap=document.getElementById('player-wrap');
  const video=document.getElementById('player-video');
  wrap.classList.add('open');

  // Limpiar instancia anterior
  if(_hlsInst){_hlsInst.destroy();_hlsInst=null;}
  video.src='';

  if(Hls.isSupported()){
    _hlsInst=new Hls({
      enableWorker:false,
      lowLatencyMode:true,
      backBufferLength:30,
    });
    _hlsInst.loadSource(url);
    _hlsInst.attachMedia(video);
    _hlsInst.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
    _hlsInst.on(Hls.Events.ERROR,(e,data)=>{
      if(data.fatal){
        // Intentar URL alternativa
        if(alts&&alts.length){
          const nextUrl=alts.shift();
          if(nextUrl&&nextUrl.url){toast('⚠️ Cambiando a señal alternativa...');openPlayer(nextUrl.url,titulo,alts);}
          else{showPlayerError();}
        }else{showPlayerError();}
      }
    });
  } else if(video.canPlayType('application/vnd.apple.mpegurl')){
    // Safari nativo (TV Tizen, WebOS)
    video.src=url;
    video.play().catch(()=>{});
  } else {
    showPlayerError();
  }
  // Foco en botón cerrar
  setTimeout(()=>document.getElementById('player-close-btn').focus(),100);
}

function showPlayerError(){
  const wrap=document.getElementById('player-wrap');
  const video=document.getElementById('player-video');
  video.style.display='none';
  const err=document.createElement('div');
  err.className='player-err';
  err.innerHTML=`<div class="icon">📡</div><p>Señal no disponible en este momento</p>`;
  wrap.appendChild(err);
}

function closePlayer(){
  if(_hlsInst){_hlsInst.destroy();_hlsInst=null;}
  const video=document.getElementById('player-video');
  video.pause(); video.src=''; video.style.display='block';
  // Quitar error si existe
  document.querySelectorAll('.player-err').forEach(e=>e.remove());
  document.getElementById('player-wrap').classList.remove('open');
  // Volver foco al contenido
  setTimeout(()=>focusFirstContent(),100);
}

// ═══ MODAL ═══
let _modalOps=[];
function showModal(titulo,ops){
  _modalOps=ops;
  document.getElementById('modalTitle').textContent=titulo;
  const list=document.getElementById('sigList');
  list.innerHTML=ops.map((op,i)=>`<button class="sig-btn" tabindex="0" onclick="selectSig(${i})">📺 ${op.label}</button>`).join('');
  document.getElementById('modal').classList.add('open');
  list.querySelector('.sig-btn')?.focus();
}
function selectSig(i){closeModal();_modalOps[i]?.fn?.();}
function closeModal(){document.getElementById('modal').classList.remove('open');}

// ═══ TOAST ═══
let toastTmr=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTmr); toastTmr=setTimeout(()=>t.classList.remove('show'),3000);
}

// ═══ HELPERS ═══
function showSpinner(){document.getElementById('content').innerHTML=`<div class="state-box"><div class="spinner"></div><p>Cargando...</p></div>`;}

// Foco al primer elemento del contenido
function focusFirstContent(){
  const c=document.getElementById('content');
  c.querySelector('[tabindex="0"]')?.focus();
}

// ═══ D-PAD — navegación posicional con soporte para subir al menú ═══
function getAll(){
  // Player abierto
  const pw=document.getElementById('player-wrap');
  if(pw.classList.contains('open')) return [...pw.querySelectorAll('[tabindex="0"]')];
  // Modal abierto
  const modal=document.getElementById('modal');
  if(modal.classList.contains('open')) return [...modal.querySelectorAll('[tabindex="0"]')];
  // App normal: tabs + backBtn + contenido
  const all=[];
  // Back button (si está visible)
  const bb=document.getElementById('backBtn');
  if(bb.classList.contains('show')) all.push(bb);
  // Tabs
  document.querySelectorAll('#tabs .tab').forEach(t=>all.push(t));
  // Contenido
  document.querySelectorAll('#content [tabindex="0"]').forEach(el=>all.push(el));
  return all;
}

function navigate(dir){
  const all=getAll();
  if(!all.length) return;
  const focused=document.activeElement;
  const idx=all.indexOf(focused);

  // Izquierda/Derecha: navegación lineal (tabs o lista de señales)
  if(dir==='right'||dir==='left'){
    if(idx<0){all[0]?.focus();return;}
    if(dir==='right') all[Math.min(idx+1,all.length-1)]?.focus();
    else              all[Math.max(idx-1,0)]?.focus();
    return;
  }

  // Arriba/Abajo: posicional
  if(idx<0){all[0]?.focus();return;}
  const rect=focused.getBoundingClientRect();
  const cx=rect.left+rect.width/2;
  const cy=rect.top+rect.height/2;

  // ¿El elemento está en el header (tabs)?
  const inHeader=focused.closest('.hdr')!=null;

  // Si voy arriba desde el contenido y no hay nada encima → saltar a tab activa
  if(dir==='up'&&!inHeader){
    // Buscar si hay algo encima en el contenido
    let best=null, bestScore=Infinity;
    for(const el of all){
      if(el===focused||el.closest('.hdr')) continue;
      const r=el.getBoundingClientRect();
      const dy=(r.top+r.height/2)-cy;
      if(dy>=0) continue;
      const score=Math.abs(dy)+Math.abs((r.left+r.width/2)-cx)*0.4;
      if(score<bestScore){bestScore=score;best=el;}
    }
    if(best){
      best.focus();
      best.scrollIntoView({block:'nearest',behavior:'smooth'});
      return;
    }
    // Nada encima en contenido → subir a tab activa
    const activeTab=document.querySelector('.tab.active')||document.querySelector('.tab');
    if(activeTab){activeTab.focus();activeTab.scrollIntoView({inline:'nearest',behavior:'smooth'});}
    return;
  }

  // Si voy abajo desde el header → primer elemento del contenido
  if(dir==='down'&&inHeader){
    focusFirstContent();
    return;
  }

  // Caso general posicional
  let best=null, bestScore=Infinity;
  for(const el of all){
    if(el===focused)continue;
    const r=el.getBoundingClientRect();
    const ex=r.left+r.width/2;
    const ey=r.top+r.height/2;
    const dy=ey-cy;
    if(dir==='up'   && dy>=0) continue;
    if(dir==='down' && dy<=0) continue;
    const score=Math.abs(dy)+Math.abs(ex-cx)*0.4;
    if(score<bestScore){bestScore=score;best=el;}
  }
  if(best){
    best.focus();
    best.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
}

document.addEventListener('keydown',e=>{
  const pw=document.getElementById('player-wrap');
  if(e.key==='Escape'||e.key==='Backspace'||e.keyCode===10009){
    if(pw.classList.contains('open')){closePlayer();e.preventDefault();return;}
    const modal=document.getElementById('modal');
    if(modal.classList.contains('open')){closeModal();e.preventDefault();return;}
    if(_stack.length){goBack();e.preventDefault();return;}
    return;
  }
  // Tecla "Return" / "Enter" de mandos Smart TV
  if(e.key==='Enter'||e.keyCode===13){
    if(document.activeElement) document.activeElement.click();
    return;
  }
  const dirs={'ArrowRight':'right','ArrowLeft':'left','ArrowUp':'up','ArrowDown':'down'};
  if(dirs[e.key]){e.preventDefault();navigate(dirs[e.key]);}
});

// ═══ INIT ═══
window.addEventListener('load',startCountdown);
